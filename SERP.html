<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Monitor · Trigger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08090c;
    --bg-2: #0e1015;
    --panel: #101318;
    --line: #23262e;
    --amber: #ffb84d;
    --amber-bright: #ffd28a;
    --amber-dim: #6b4b1f;
    --amber-glow: rgba(255,184,77,.35);
    --text: #e7e2d6;
    --muted: #6f7178;
    --red: #ff5c5c;
    --red-glow: rgba(255,92,92,.35);
    --radius: 14px;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    font-family:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    background:
      radial-gradient(1100px 700px at 50% 18%, #12151b 0%, var(--bg) 60%),
      var(--bg);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    position:relative;
    overflow:hidden;
  }

  /* faint drifting grid, like a scope background */
  body::before{
    content:"";
    position:fixed;
    inset:-2px;
    background-image:
      linear-gradient(rgba(255,184,77,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,184,77,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(circle at 50% 40%, black 0%, transparent 70%);
    pointer-events:none;
  }

  .console{
    position:relative;
    width:100%;
    max-width:420px;
    background: linear-gradient(180deg, var(--panel), var(--bg-2));
    border:1px solid var(--line);
    border-radius: var(--radius);
    padding: 34px 30px 26px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,.7),
      inset 0 1px 0 rgba(255,255,255,.03);
  }

  .console::before{
    /* top hairline accent */
    content:"";
    position:absolute;
    top:0; left:18px; right:18px; height:1px;
    background: linear-gradient(90deg, transparent, var(--amber-dim), transparent);
  }

  .row-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 30px;
  }

  .eyebrow{
    font-size:11px;
    letter-spacing:.22em;
    color: var(--amber);
    font-weight:600;
    text-transform:uppercase;
  }

  .dot-status{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:10px;
    letter-spacing:.14em;
    color: var(--muted);
    text-transform:uppercase;
  }

  .dot-status i{
    width:6px; height:6px; border-radius:50%;
    background: var(--amber-dim);
    box-shadow: 0 0 0 0 var(--amber-glow);
    transition: background .3s ease;
  }
  .dot-status.idle i{ background: var(--muted); }
  .dot-status.busy i{
    background: var(--amber);
    animation: pulse-dot 1s ease-in-out infinite;
  }
  .dot-status.ok i{ background: var(--amber-bright); }
  .dot-status.err i{ background: var(--red); }

  @keyframes pulse-dot{
    0%,100%{ box-shadow:0 0 0 0 var(--amber-glow); }
    50%{ box-shadow:0 0 0 5px transparent; }
  }

  /* ---------- radar ---------- */
  .radar-wrap{
    display:flex;
    justify-content:center;
    margin: 4px 0 26px;
  }

  .radar{
    position:relative;
    width:210px;
    height:210px;
    border-radius:50%;
  }

  .radar-rings{
    position:absolute; inset:0;
    border-radius:50%;
    background:
      radial-gradient(circle,
        transparent 0 28%,
        rgba(255,184,77,.09) 28% 29.3%,
        transparent 29.3% 51%,
        rgba(255,184,77,.09) 51% 52.3%,
        transparent 52.3% 74%,
        rgba(255,184,77,.13) 74% 75.3%,
        transparent 75.3%
      );
  }

  .radar-sweep{
    position:absolute; inset:0;
    border-radius:50%;
    overflow:hidden;
  }
  .radar-sweep::after{
    content:"";
    position:absolute;
    inset:0;
    background: conic-gradient(from 0deg, transparent 0deg, var(--amber-glow) 18deg, transparent 46deg);
    animation: sweep 5.5s linear infinite;
    opacity:.55;
  }
  .radar.scanning .radar-sweep::after{
    animation-duration: 1.1s;
    opacity:1;
  }
  @keyframes sweep{ to{ transform:rotate(360deg); } }

  .blips{ position:absolute; inset:0; }
  .blip{
    position:absolute;
    width:5px; height:5px;
    border-radius:50%;
    background: var(--amber-bright);
    box-shadow: 0 0 8px 2px var(--amber-glow);
    animation: blip-in .6s ease forwards;
  }
  @keyframes blip-in{
    0%{ transform:scale(0); opacity:0; }
    40%{ transform:scale(1.4); opacity:1; }
    100%{ transform:scale(1); opacity:.85; }
  }

  .radar-btn{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:96px; height:96px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #1c1f26, #0c0e12 70%);
    border:1px solid var(--amber-dim);
    color: var(--amber-bright);
    font-family:inherit;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    cursor:pointer;
    letter-spacing:.08em;
    transition: box-shadow .25s ease, border-color .25s ease, transform .15s ease;
    box-shadow: 0 0 0 0 var(--amber-glow);
  }
  .radar-btn:hover:not(:disabled){
    border-color: var(--amber);
    box-shadow: 0 0 26px -2px var(--amber-glow);
  }
  .radar-btn:active:not(:disabled){ transform:translate(-50%,-50%) scale(.96); }
  .radar-btn:focus-visible{
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }
  .radar-btn:disabled{
    cursor:not-allowed;
    color: var(--muted);
    border-color: var(--line);
  }

  .btn-icon{ font-size:15px; line-height:1; }
  .btn-label{
    font-size:10.5px;
    font-weight:600;
    text-align:center;
    line-height:1.35;
    text-transform:uppercase;
  }

  /* ---------- terminal readout ---------- */
  .terminal{
    background: #0a0c10;
    border:1px solid var(--line);
    border-radius:8px;
    padding: 13px 14px;
    min-height: 78px;
    font-size:12.5px;
    line-height:1.65;
    color: var(--muted);
  }

  .term-line{ display:flex; gap:8px; opacity:0; animation: line-in .35s ease forwards; }
  .term-line + .term-line{ margin-top:2px; }
  .term-line .tag{ color: var(--amber-dim); flex-shrink:0; }
  .term-line.state-ok .tag{ color: var(--amber-bright); }
  .term-line.state-err .tag{ color: var(--red); }
  .term-line.state-busy .tag{ color: var(--amber); }

  @keyframes line-in{ from{ opacity:0; transform:translateY(2px);} to{ opacity:1; transform:translateY(0);} }

  .cursor{
    display:inline-block;
    width:6px; height:12px;
    background: var(--amber);
    margin-left:2px;
    animation: blink 1s step-end infinite;
    vertical-align:-2px;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .foot{
    margin-top:18px;
    text-align:center;
    font-size:10px;
    letter-spacing:.12em;
    color: var(--line);
    text-transform:uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .radar-sweep::after{ animation:none; opacity:.35; }
    .dot-status.busy i{ animation:none; }
    .cursor{ animation:none; }
    .term-line{ animation:none; opacity:1; }
  }

  @media (max-width:420px){
    .radar{ width:180px; height:180px; }
    .radar-btn{ width:84px; height:84px; }
  }
</style>
</head>
<body>

  <div class="console">
    <div class="row-top">
      <div class="eyebrow">Brand Monitor</div>
      <div class="dot-status idle" id="dotStatus"><i></i><span id="dotLabel">Idle</span></div>
    </div>

    <div class="radar-wrap">
      <div class="radar" id="radar">
        <div class="radar-rings"></div>
        <div class="radar-sweep"></div>
        <div class="blips" id="blips"></div>
        <button id="runBtn" class="radar-btn" aria-label="Run brand analysis">
          <span class="btn-icon">▶</span>
          <span class="btn-label">Run<br>Scan</span>
        </button>
      </div>
    </div>

    <div class="terminal" id="terminal" aria-live="polite">
      <div class="term-line" style="animation-delay:.05s"><span class="tag">&gt;</span><span>awaiting command<span class="cursor"></span></span></div>
    </div>

    <div class="foot">Report delivered by email · usually 1–2 min</div>
  </div>

<script>
(function(){
  const btn = document.getElementById('runBtn');
  const terminal = document.getElementById('terminal');
  const radar = document.getElementById('radar');
  const blipsWrap = document.getElementById('blips');
  const dotStatus = document.getElementById('dotStatus');
  const dotLabel = document.getElementById('dotLabel');

  const webhookUrl = 'https://harshdave2800.pythonanywhere.com/run-script';
  const secretToken = 'MySup3rSecr3t!2025'; // Must match .env on PythonAnywhere

  let blipInterval = null;

  function setDot(state, label){
    dotStatus.className = 'dot-status ' + state;
    dotLabel.textContent = label;
  }

  function addLine(text, state){
    const line = document.createElement('div');
    line.className = 'term-line' + (state ? ' state-' + state : '');
    line.innerHTML = '<span class="tag">&gt;</span><span>' + text + '</span>';
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
    return line;
  }

  function clearTerminal(){
    terminal.innerHTML = '';
  }

  function spawnBlip(){
    const blip = document.createElement('div');
    blip.className = 'blip';
    const angle = Math.random() * Math.PI * 2;
    const radius = 30 + Math.random() * 65; // stay within rings
    const cx = 105 + Math.cos(angle) * radius;
    const cy = 105 + Math.sin(angle) * radius;
    blip.style.left = cx + 'px';
    blip.style.top = cy + 'px';
    blipsWrap.appendChild(blip);
    setTimeout(() => blip.remove(), 2200);
  }

  btn.addEventListener('click', function(){
    btn.disabled = true;
    radar.classList.add('scanning');
    setDot('busy', 'Scanning');
    clearTerminal();
    addLine('sending trigger signal to engine' + '<span class="cursor"></span>', 'busy');

    blipInterval = setInterval(spawnBlip, 380);

    const soonTimer = setTimeout(() => {
      const prev = terminal.querySelector('.term-line:last-child .cursor');
      if (prev) prev.remove();
      addLine('signal received — scan running, this can take 1–2 min' + '<span class="cursor"></span>', 'busy');
    }, 900);

    fetch(webhookUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Trigger-Token': secretToken
      }
    })
    .then(response => {
      if (!response.ok) {
        return response.json().then(data => {
          throw new Error(data.error || 'Server error');
        });
      }
      return response.json();
    })
    .then(data => {
      clearInterval(blipInterval);
      const cur = terminal.querySelector('.cursor');
      if (cur) cur.remove();
      const stamp = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      addLine('scan complete — report sent, ' + stamp, 'ok');
      setDot('ok', 'Complete');
      radar.classList.remove('scanning');
      console.log('Output:', data.stdout);
    })
    .catch(error => {
      clearInterval(blipInterval);
      const cur = terminal.querySelector('.cursor');
      if (cur) cur.remove();
      addLine('error — ' + error.message, 'err');
      setDot('err', 'Failed');
      radar.classList.remove('scanning');
    })
    .finally(() => {
      clearTimeout(soonTimer);
      btn.disabled = false;
    });
  });
})();
</script>

</body>
</html>
